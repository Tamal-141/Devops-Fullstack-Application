# Replaces /etc/nginx/conf.d/default.conf in the nginx:alpine image. The image's main
# nginx.conf includes conf.d/*.conf inside its `http {}` block, so this file only
# defines what goes in there.

# Access log line with the request id nginx forwards to the backend as X-Request-Id,
# so one request can be followed from this log into the backend's JSON log.
log_format shoplite '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    '${request_time}s rid=$request_id upstream=$upstream_status';

server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log shoplite;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS server, present on every user-defined network.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # proxy_pass with a *variable* makes nginx resolve "backend" per request (cached
        # 10s) instead of once at startup. A redeploy recreates the backend container
        # with a new IP; with a fixed name nginx would keep the old IP and return 502
        # until it was restarted too. A variable proxy_pass passes the URI unchanged,
        # so /api/health reaches the backend as /api/health.
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The backend trusts exactly one proxy hop (app.set('trust proxy', 1)), so it
        # reads the client's IP from here — needed by the login rate limiter.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Vite puts a content hash in every asset filename (index-BejqEg6G.css), so a new
    # build means new names — these can be cached for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Liveness for the container healthcheck: nginx itself answering, no disk, no
    # backend. Kept out of the access log because it is hit every 10 seconds.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        # SPA fallback: /products/3 is not a file on disk. Serve index.html and let
        # React Router pick the page. Without this, a refresh on any page but / is a 404.
        try_files $uri $uri/ /index.html;
        # index.html names the current asset files, so it must never be cached.
        expires -1;
    }
}
